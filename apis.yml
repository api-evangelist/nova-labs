aid: nova-labs
name: Nova Labs
description: >-
  Nova Labs, Inc. is the company behind the Helium Network, a decentralized
  wireless network that replaces traditional carrier infrastructure with
  community-hosted Hotspots and is coordinated on the Solana blockchain and
  incentivized with the HNT token. Helium operates two networks: a global
  LoRaWAN network for low-power IoT devices and a cellular/Wi-Fi offload
  network for mobile connectivity (Helium Mobile). Nova Labs open-sources the
  network's protocol surface as gRPC/Protobuf service definitions (the
  helium/proto config, router, and proof-of-coverage services) and publishes
  a set of first-party client libraries, a command-line tool, and Rust crates
  for cryptography and protobuf types. This profile was surfaced as an a16z
  portfolio company and enriched from Nova Labs' public developer surface;
  much of the legacy Helium IoT REST API tooling is archived following the
  network's migration to Solana.
